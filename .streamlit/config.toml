# NO port pin here — with no explicit port, Streamlit auto-increments
# (8501 busy -> 8502 -> 8503 ...), so MULTIPLE dashboards can run at once.
#
# Port map (launchers pass ports explicitly, so these are deterministic):
#   8501  swing_app.py       -> start_swing.bat / run_system.bat / start_ui.bat
#   8503  streamlit_app.py   -> start_legacy.bat (legacy dashboard, needs Dhan token)
#   85xx  anything ad-hoc    -> `streamlit run <app>` picks the next free port
[browser]
gatherUsageStats = false
