name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # config.py is gitignored (it holds local credentials), so CI runs against
      # the committed example — which is a complete, PAPER_TRADE=True default set.
      - name: Create config from example
        run: cp config.example.py config.py

      - name: Run tests
        run: python -m pytest tests/ -q --no-header

      # Guardrail: the suite must never run against live-order settings, and a
      # real config.py must never be committed.
      - name: Assert safety rails
        run: |
          python -c "import config; assert config.PAPER_TRADE is True, 'PAPER_TRADE must be True'"
          test -z "$(git ls-files config.py)" || { echo 'config.py must not be committed'; exit 1; }
