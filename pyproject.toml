# Project tooling config. Not a packaging manifest — this repo is run in place
# (see start_trading.bat), not pip-installed. This file exists so CI, ruff, and
# pytest read the same settings a developer does locally.

[tool.ruff]
line-length = 100
target-version = "py312"
# CI lints application code only. Generated / vendored / non-Python trees are
# excluded so the signal is about our code, not third-party or build output.
extend-exclude = [
    "trading-ui",
    "logs",
    "brain",
    "docs",
    "package",
    "build",
    "dist",
    "tmp_stat_test",
    "*.backfilled.jsonl",
]

[tool.ruff.lint]
# Full informational set (the non-blocking CI step reports these). The BLOCKING
# CI step overrides `select` on the command line with the "code is broken" rules
# only (E9/F63/F7/F82), so legacy style noise never fails a build.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length — long lines are legacy-pervasive, not a correctness issue
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --no-header"
# Keep CI deterministic: a bare `pytest` locally matches CI.
